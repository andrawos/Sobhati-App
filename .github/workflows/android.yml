name: Build Sobhati Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT"; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('www/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          Path('/tmp/sobhati-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sobhati-inline.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Apply approved launcher icon
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          svg = Path('www/icon.svg').read_text(encoding='utf-8')
          match = re.search(r'data:image/jpeg;base64,([^" ]+)', svg)
          if not match:
              raise SystemExit('Embedded app artwork was not found in www/icon.svg')
          Path('/tmp/sobhati-icon.jpg').write_bytes(base64.b64decode(match.group(1)))
          PY
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            size=${sizes[$density]}
            convert /tmp/sobhati-icon.jpg -resize "${size}x${size}!" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          convert /tmp/sobhati-icon.jpg -resize 66%x66% -gravity center -background none -extent 432x432 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#073B2C</color></resources>
          XML
      - name: Add location permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # Preserve the Android namespace prefix required by Android's manifest merger.
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')

          p = Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(p)
          root = tree.getroot()
          android = '{http://schemas.android.com/apk/res/android}'

          existing = {
              node.get(android + 'name')
              for node in root.findall('uses-permission')
          }

          for permission in (
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
          ):
              if permission not in existing:
                  ET.SubElement(root, 'uses-permission', {android + 'name': permission})

          tree.write(p, encoding='utf-8', xml_declaration=True)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Package source ZIP
        run: zip -r Sobhati-Source.zip www package.json capacitor.config.json .github
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sobhati-Source
          path: Sobhati-Source.zip
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sobhati-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
